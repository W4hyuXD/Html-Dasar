<!DOCTYPE html>
<html>
<head>
  <title>tabel complex</title>
  <a href="sdcard/coding/learning/Html/Tabel/style.css"></a>
</head>
<body>
<table>
  <thead>
    <tr>
      <th></th> <!-- header -->
      <th>Kolom 1</th> <!-- header -->
      <th>Kolom 2</th> <!-- header -->
    </tr>
  </thead>
  <tbody>
    <tr>
      <th>baris 1</th> <!-- header -->
      <td>baris 1, kolom 1</td>
      <td>baris 1, kolom 2</td>
    </tr>
    <tr>
      <th>baris 2</th> <!-- header -->
      <td>baris 2, kolom 1</td>
      <td>baris 2, kolom 2</td>
    </tr>
  </tbody>
</table>
</body>
</html>
